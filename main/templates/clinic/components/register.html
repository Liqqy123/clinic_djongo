{% extends 'clinic/base.html' %}

{% block title %}Регистрация — Поликлиника{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Регистрация пациента</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div style="background: #fee; border: 1px solid #f88; color: #c33; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                {{ form.non_field_errors }}
            </div>
        {% endif %}
        
        {{ form.as_p }}
        
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        Уже есть аккаунт? <a href="{% url 'clinic_login' %}">Войти</a>
    </p>
</div>
{% endblock %}
