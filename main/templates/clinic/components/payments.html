{% extends 'clinic/base.html' %}

{% block title %}Оплата услуг — Поликлиника{% endblock %}

{% block content %}
<div class="card">
    <h2>Оплата услуги врача</h2>
    {% if saved %}
        <div class="success">Платеж зарегистрирован.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Оплатить</button>
    </form>
</div>
{% endblock %}
