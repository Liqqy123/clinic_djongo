<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Поликлиника{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f8; color: #1f2937; margin: 0; padding: 0; }
        .page { max-width: 1024px; margin: 0 auto; padding: 1.5rem; }
        header { background: #2563eb; color: white; padding: 1rem 1.5rem; margin-bottom: 1.5rem; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
        button { background: #2563eb; color: white; border: none; border-radius: 0.65rem; padding: 0.75rem 1.25rem; cursor: pointer; }
        .top-links a { color: white; text-decoration: none; margin-right: 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="page">
            <h1>🏥 Поликлиника</h1>
            <div class="top-links">
                <a href="/main/">Главная</a>
                <a href="/admin/">Админка</a>
            </div>
        </div>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
