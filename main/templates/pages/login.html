{% extends 'base.html' %}

{% block title %}Вход - ЗдравТочка{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 40px auto;">
    <div class="card">
        <h2>Вход в личный кабинет</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Войти</button>
        </form>
        <p style="margin-top: 20px;">Нет аккаунта? <a href="{% url 'clinic_register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
