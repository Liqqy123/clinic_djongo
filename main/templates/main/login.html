{% extends 'main/base.html' %}

{% block title %}Вход - Clinic{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Вход в поликлинику</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div style="background: #fee; border: 1px solid #f88; color: #c33; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="form-group">
            <label>Имя пользователя</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Пароль</label>
            {{ form.password }}
        </div>
        
        <button type="submit">Войти</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        Нет аккаунта? <a href="{% url 'clinic_register' %}">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
